<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05060f" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="نبرد سایبری" />
    <meta
      name="description"
      content="نبرد سایبری - بازی تیراندازی اول‌شخص سه‌بعدی مخصوص موبایل"
    />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <title>نبرد سایبری | بازی اول‌شخص سه‌بعدی</title>
  </head>
  <body>
    <div id="root">
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          background: #05060f;
          color: #67e8f9;
          font-family: 'Vazirmatn', system-ui, sans-serif;
        "
      >
        <div
          style="
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid rgba(34, 211, 238, 0.25);
            border-top-color: #22d3ee;
            animation: boot-spin 0.9s linear infinite;
          "
        ></div>
        <div style="font-size: 13px; letter-spacing: 0.3em">CYBER ARENA 3D</div>
        <style>
          @keyframes boot-spin {
            to {
              transform: rotate(360deg);
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
