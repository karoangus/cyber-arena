# دیپلوی بیلد تولیدی بازی روی GitHub Pages
# مشکل قبلی: Pages سورس خام (main /) را سرو می‌کرد که مرورگر نمی‌تواند اجرا کند
# و صفحه‌ی «بازی لود نشد — اتصال اینترنت را بررسی کن» نشان داده می‌شد.
# الان: بیلد Vite (تک‌فایل، کاملاً آفلاین) ساخته و روی Pages منتشر می‌شود.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # برای کامیت‌کردن بیلد تازه در app/ (حالت legacy صفحه‌ساز Pages)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck & build (single-file offline bundle)
        run: npm run build
      # حالت legacy صفحه‌ساز Pages ریشه‌ی مخزن را سرو می‌کند؛ پس بیلد تازه را در app/ کامیت می‌کنیم
      # تا سایت بدون هیچ تنظیم دستی به‌روز بماند. (اگر Pages به «GitHub Actions» سوییچ شود،
      # به‌جای این کار artifact زیر مستقیم منتشر می‌شود.)
      - name: Commit fresh build to app/ (for legacy Pages serving repo root)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "Build output unchanged — nothing to commit."
          else
            git commit -m "بیلد خودکار: به‌روزرسانی app/"
            git push origin HEAD:main || echo "::warning::push failed (concurrent update); build committed locally only"
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # اطمینان از اینکه Pages در حالت «GitHub Actions» (artifact) است، نه «Deploy from branch».
      # در حالت legacy، سورس خام مخزن سرو می‌شود که مرورگر نمی‌تواند اجرا کند (باگ قبلی «بازی لود نشد»).
      - name: Ensure Pages uses artifact (Actions) deployment mode
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '{"build_type":"workflow"}' > pages-mode.json
          if gh api -X PUT "repos/${{ github.repository }}/pages" --input pages-mode.json; then
            echo "Pages switched to workflow (artifact) mode."
          else
            echo "::warning::Could not switch Pages mode automatically — flip it manually: Settings → Pages → Build and deployment → Source: GitHub Actions"
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
