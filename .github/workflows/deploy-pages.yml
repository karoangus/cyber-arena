# دیپلوی بیلد تولیدی بازی روی GitHub Pages
# مشکل قبلی: Pages سورس خام (main /) را سرو می‌کرد که مرورگر نمی‌تواند اجرا کند
# و صفحه‌ی «بازی لود نشد — اتصال اینترنت را بررسی کن» نشان داده می‌شد.
# الان: بیلد Vite (تک‌فایل، کاملاً آفلاین) ساخته و روی Pages منتشر می‌شود.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck & build (single-file offline bundle)
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
